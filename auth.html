<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - LucyBliss Casino</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-icon">🎰</span>
                <span class="logo-text">LucyBliss</span>
            </div>

            <!-- Форма входа -->
            <div id="loginForm" class="auth-form active">
                <h2>Вход в аккаунт</h2>
                <p class="subtitle">Войдите, чтобы продолжить игру</p>

                <div class="form-group">
                    <label for="loginUsername">Имя пользователя</label>
                    <input type="text" id="loginUsername" placeholder="Введите имя пользователя" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                </div>

                <button class="btn-primary" id="btnLogin">Войти</button>

                <div class="auth-divider">или</div>

                <button class="btn-secondary" id="showRegister">Создать аккаунт</button>
            </div>

            <!-- Форма регистрации -->
            <div id="registerForm" class="auth-form">
                <h2>Регистрация</h2>
                <p class="subtitle">Создайте аккаунт для игры</p>

                <div class="form-group">
                    <label for="regUsername">Имя пользователя</label>
                    <input type="text" id="regUsername" placeholder="Введите имя пользователя" required>
                    <span class="input-hint">Минимум 3 символа</span>
                </div>

                <div class="form-group">
                    <label for="regPassword">Пароль</label>
                    <input type="password" id="regPassword" placeholder="Введите пароль" required>
                    <span class="input-hint">Минимум 6 символов</span>
                </div>

                <div class="form-group">
                    <label for="regPasswordConfirm">Подтвердите пароль</label>
                    <input type="password" id="regPasswordConfirm" placeholder="Повторите пароль" required>
                </div>

                <button class="btn-primary" id="btnRegister">Создать аккаунт</button>

                <div class="auth-divider">или</div>

                <button class="btn-secondary" id="showLogin">Уже есть аккаунт? Войти</button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
