<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash - LucyBliss Casino</title>
    <link rel="stylesheet" href="crash.css">
</head>
<body>
    <!-- Боковое меню -->
    <aside class="sidebar">
        <!-- Счетчик игроков онлайн -->
        <div class="online-counter">
            <span class="online-dot"></span>
            <span class="online-text">Игроков онлайн</span>
            <span class="online-count" id="onlineCount">5 390</span>
        </div>

        <!-- Профиль/Вход -->
        <div class="user-profile-section" id="userProfileSection">
            <div class="avatar-circle" id="userAvatar">👤</div>
            <div class="profile-content" id="profileContent">
                <span class="login-text">Войти</span>
                <span class="arrow-icon">›</span>
            </div>
            <div class="user-info-block" id="userInfoBlock" style="display: none;">
                <div class="user-info" id="userInfo">
                    <div class="username" id="userName"></div>
                    <div class="user-id" id="userId"></div>
                </div>
                <button class="btn-logout-inline" id="btnLogout">Выйти</button>
            </div>
        </div>

        <nav class="main-nav">
            <a href="index.html" class="nav-item">
                <span class="icon">🎰</span>
                <span>Казино</span>
            </a>
            <a href="#" class="nav-item">
                <span class="icon">🎮</span>
                <span>Live казино</span>
            </a>
            <a href="#" class="nav-item">
                <span class="icon">⚽</span>
                <span>Спорт</span>
            </a>
        </nav>

        <div class="nav-divider"></div>

        <div class="nav-section">
            <a href="bonuses.html" class="nav-item">
                <span class="icon">🎁</span>
                <span>Бонусы</span>
                <span class="badge">2</span>
            </a>
            <a href="promotions.html" class="nav-item">
                <span class="icon">🏆</span>
                <span>Акции</span>
            </a>
            <a href="admin.html" class="nav-item admin-link">
                <span class="icon">⚙️</span>
                <span>Админ-панель</span>
            </a>
        </div>
    </aside>

    <!-- Основной контент игры -->
    <div class="game-wrapper">
        <!-- Хедер -->
        <header class="game-header">
            <div class="game-title">
                <button class="btn-back" id="btnBack">←</button>
                <span class="game-name-header">LucyBliss • CRASH</span>
                <span class="rtp-indicator" id="rtpIndicator">RTP: 97.0%</span>
            </div>
            
            <div class="header-right">
                <div class="user-info-display" id="userInfoDisplay" style="display: none;">
                    <span class="username-display" id="usernameDisplay"></span>
                    <button class="btn-logout-header" id="btnLogoutHeader">Выйти</button>
                </div>
                <div class="header-actions" id="headerActions" style="display: none;">
                    <div class="balance-display" id="balanceDisplay">
                        <span class="balance-value" id="userBalance">1000.00</span>
                        <span class="balance-currency">₽</span>
                        <span class="balance-mode" id="balanceMode">(демо)</span>
                    </div>
                    <button class="btn-notifications" id="btnNotifications">🔔</button>
                </div>
            </div>
        </header>

        <div class="crash-container">
            <!-- График -->
            <div class="crash-graph-area">
                <canvas id="crashCanvas"></canvas>
                <div class="multiplier-display" id="multiplierDisplay">x1.00</div>
                <div class="crash-message" id="crashMessage"></div>
            </div>

            <!-- Панель управления -->
            <div class="crash-controls">
                <div class="bet-panel">
                    <div class="bet-input-group">
                        <label>Ставка</label>
                        <div class="input-wrapper">
                            <button class="btn-decrease" id="decreaseBet">-</button>
                            <input type="number" id="betInput" value="18.00" step="1" min="0.20">
                            <button class="btn-increase" id="increaseBet">+</button>
                        </div>
                    </div>

                    <div class="auto-cashout-group">
                        <label>Авто-вывод</label>
                        <div class="input-wrapper">
                            <input type="number" id="autoCashout" value="2.00" step="0.1" min="1.01" placeholder="x2">
                        </div>
                    </div>

                    <button class="btn-place-bet" id="placeBetBtn">Ставка</button>
                    <button class="btn-cashout" id="cashoutBtn" style="display: none;">Забрать</button>
                </div>

                <!-- История игр -->
                <div class="crash-history">
                    <div class="history-title">История</div>
                    <div class="history-items" id="historyItems"></div>
                </div>
            </div>

            <!-- Таблица ставок -->
            <div class="bets-table">
                <div class="table-header">
                    <span>Мои ставки</span>
                </div>
                <div class="table-content" id="betsTable">
                    <div class="empty-state">Нет активных ставок</div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script src="crash.js"></script>
</body>
</html>
